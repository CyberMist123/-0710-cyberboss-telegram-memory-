name: PR6 final dashboard cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'feat/cyberlink-cost-reduction' && !contains(github.event.pull_request.head.sha, '0000000')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cyberlink-cost-reduction
          fetch-depth: 0
      - name: Remove duplicate dashboard function
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('extensions/relationship-memory/memory-kit/dashboard.py')
          text = path.read_text(encoding='utf-8')
          pattern = r"async function loadDesireSchedule\(\) \{\n.*?\n\}\n\nfunction formatScheduleTime"
          text, count = re.subn(pattern, 'function formatScheduleTime', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one duplicate function block, replaced {count}')
          if text.count('async function loadDesireSchedule() {') != 1:
              raise SystemExit('dashboard must contain exactly one loadDesireSchedule function')
          path.write_text(text, encoding='utf-8', newline='\n')
      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/pr6-final-dashboard-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extensions/relationship-memory/memory-kit/dashboard.py .github/workflows/pr6-final-dashboard-cleanup.yml
          git commit -m 'fix(dashboard): remove duplicate schedule loader'
          git push origin HEAD:feat/cyberlink-cost-reduction
