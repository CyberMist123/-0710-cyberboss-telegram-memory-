name: Phase 1 Offline

on:
  push:
    branches:
      - impl/overnight-memory
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-offline:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: npm run check

      - name: Phase 1 offline tests
        run: npm run test:phase1
