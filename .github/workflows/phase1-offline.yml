name: phase1-offline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-offline:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies for phase 1 tests
        run: python -m pip install -r extensions/relationship-memory/memory-kit/requirements.txt

      - name: Static checks
        run: npm run check

      - name: Phase 1 tests
        run: npm run test:phase1

      - name: Phase 2 hard-context tests
        run: npm run test:phase2

      - name: Phase 3 continuity-pipeline tests
        run: npm run test:phase3

      - name: Phase 4 read-only console tests
        run: npm run test:phase4

      - name: Diff hygiene
        run: git diff --check
