name: Public readiness secret audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all reachable refs
        shell: bash
        run: git fetch --all --tags --prune

      - name: Scan reachable blobs without printing secret values
        id: scan
        continue-on-error: true
        shell: bash
        run: python scripts/secret_audit_scan.py

      - name: Upload redacted audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-audit-report
          path: secret-audit-report.json
          if-no-files-found: error
          retention-days: 3

      - name: Enforce audit result
        if: steps.scan.outcome != 'success'
        shell: bash
        run: exit 1
