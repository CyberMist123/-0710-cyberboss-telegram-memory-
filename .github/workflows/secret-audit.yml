name: Public readiness secret audit

on:
  pull_request:
    branches: [main]
  # main push 是事后兜底：默认流程是批次直推，push 前的强制闸在本机
  # (.githooks/pre-push)。公开仓库上「推完才发现」已经晚了，这里只负责
  # 在本机闸被 --no-verify 绕过或未安装时留下红色记录。
  # D51 之后本机闸只做增量扫描（--push-tip），这里的全量 rev-list --all
  # 就是增量模式的诚实性兜底——不要因为"本机已经扫过"而删掉这个触发器。
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all reachable refs
        shell: bash
        run: git fetch --all --tags --prune

      - name: Scan reachable blobs without printing secret values
        id: scan
        continue-on-error: true
        shell: bash
        run: python scripts/secret_audit_scan.py

      - name: Upload redacted audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-audit-report
          path: secret-audit-report.json
          if-no-files-found: error
          retention-days: 3

      - name: Enforce audit result
        if: steps.scan.outcome != 'success'
        shell: bash
        run: exit 1
