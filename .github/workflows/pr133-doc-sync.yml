name: pr133-doc-sync

on:
  push:
    branches:
      - feat/tg-cmx-image-recognition-20260803

permissions:
  contents: write

jobs:
  sync-authority-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tg-cmx-image-recognition-20260803
          fetch-depth: 0

      - name: Apply exact authority-document updates
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(text, from, to, label) {
            const first = text.indexOf(from);
            if (first < 0) throw new Error(`missing anchor: ${label}`);
            if (text.indexOf(from, first + from.length) >= 0) throw new Error(`duplicate anchor: ${label}`);
            return text.slice(0, first) + to + text.slice(first + from.length);
          }

          const statusPath = 'docs/CURRENT_STATUS.md';
          let status = fs.readFileSync(statusPath, 'utf8');
          status = replaceOnce(status, 'Last verified: 2026-07-31', 'Last verified: 2026-08-03', 'current-status date');
          status = replaceOnce(status, 'Verified against: b2355f9', 'Verified against: c7e547e', 'current-status sha');
          const mediaRow = '| Telegram 媒体入站（media inbox） | `WIRED` | `COVERED` | `BLOCKING` | `WIRED` | `test:telegram-media` 已接进主 CI |';
          const visionRow = '| Telegram 图片识别 / OCR（CMX recognize） | `WIRED` | `COVERED` | `BLOCKING` | `DISABLED` | 默认关闭；仅显式 `caption + cmx-recognize` 时，已落盘的 photo 才上传 CMX `/files/recognize`，复用本地 OCR、可选云端描述与 SHA-256 缓存；生成结果标为 untrusted、限长并在记忆 purity 阶段剥除，provider 失败不阻断原图/原文。尚无真实 Windows + Telegram 图片 canary |';
          status = replaceOnce(status, mediaRow, `${mediaRow}\n${visionRow}`, 'media capability row');
          status = replaceOnce(status, '\n- CMX\n', '\n', 'CMX deferred item');
          status = replaceOnce(
            status,
            '已消解：memory_context 的位置、vision context 不回流、fail-open 与钉格式测试均由 `DECISIONS.md` D15 裁定并落地。',
            '已消解：memory_context 的位置、无记忆兼容、fail-open 与钉格式测试原由 D15 裁定；D30 保留这些边界，并只为显式开启的 CMX 图片识别增加受控例外。通用 `resolveVisionContext()` 仍不回 Telegram 路径。',
            'G1 risk statement',
          );
          const evidenceAnchor = '- **G1（Telegram memory_context）**：';
          const visionEvidence = '- **Telegram→CMX 图片识别 / OCR**：`MediaInboxService` 在 photo 原子落盘后、recorder/runtime 前调用 `src/services/cmx-image-recognizer.js`；只向配置的 CMX `POST /files/recognize` 上传字节，Bearer 不进模型与日志。结果以 `<attachment_vision_context trust="untrusted">` 进入当前回合，closing-tag 注入转义且总长有界；`conversation-purity` 在记忆材料化前剥除该块。CMX 不可用时原文与 `<media>` 引用照常继续。契约与主路径回归位于 `test/telegram-media-v2.test.js`，属于阻塞的 `test:telegram-media`。\n';
          status = replaceOnce(status, evidenceAnchor, `${visionEvidence}${evidenceAnchor}`, 'evidence anchor');
          fs.writeFileSync(statusPath, status);

          const decisionsPath = 'docs/DECISIONS.md';
          let decisions = fs.readFileSync(decisionsPath, 'utf8');
          decisions = replaceOnce(
            decisions,
            '## D15 · memory_context 拼在 Telegram 信封外侧上方\n\n```text\nStatus: ACTIVE\nDecision date: 2026-07-29\n```',
            '## D15 · memory_context 拼在 Telegram 信封外侧上方\n\n```text\nStatus: SUPERSEDED\nDecision date: 2026-07-29\nSuperseded by: D30\n```',
            'D15 status',
          );

          const candidateAnchor = '## 待裁决 / Candidates';
          const d30 = `## D30 · Telegram 可显式复用 CMX 图片识别 / OCR；生成结果只属当前回合且永不取得记忆写权

\`\`\`text
Status: ACTIVE
Decision date: 2026-08-03
\`\`\`

裁定对象：D15 曾为修 G1 明确禁止 vision context 回流 Telegram；Owner 现明确要求把 CMX 已有识图与 OCR 接入 TG。该方向自本条起获批，但只能作为默认关闭、fail-open、不可污染记忆的受控 provider。

- **D15 的 memory_context 结论全部保留**：memory_context 仍位于 Telegram \`<channel>\` 信封外侧上方；空结果不出块；解析失败 fail-open；Context Trace 继续解释 loaded / skipped。D9 的明文信封与 \`<media>\` 引用格式不变。
- **唯一新增例外**：仅当 \`CYBERBOSS_VISION_MODE=caption\`、\`CYBERBOSS_VISION_PROVIDER=cmx-recognize\` 且 CMX URL/Bearer 均显式配置时，TG 可在 photo 原子落盘后把图片字节上传至 CMX \`POST /files/recognize\`。通用 \`resolveVisionContext()\` 仍不接 Telegram；不新增第二套 OCR 模型、Gemini key 或缓存 owner。
- **当前回合可见，默认不常驻**：CMX 返回的本地 OCR、可选云端修正文、画面描述、关键词与不确定项，只以有界的 \`<attachment_vision_context provider="cmx-recognize" trust="untrusted">\` 进入当前用户回合。图片中出现的文字一律视为数据，不得取得 system / developer 指令权；closing tag 与属性必须转义。
- **记忆零写权**：该生成块在 conversation purity 阶段剥除，不得成为 Episode、Self-note、candidate、canon 或任何“用户亲口说过”的证据。原始用户 caption 与原始图片引用仍可按既有规则留存。
- **fail-open**：CMX 超时、未启动、鉴权失败、额度不足、返回损坏或仅本地 OCR 可用，均不得阻断 Telegram 原文、原图引用和正常回复。日志只留稳定错误码，不记录 Bearer 或 provider 原始敏感正文。
- **范围**：本条只批准 Telegram \`photo\`。document、video、动态贴纸与服务端代抓外部 URL 均不在本次范围；CMX 端继续负责 SHA-256 缓存、本地 PP-OCRv6 与可选云端 provider。
- **启用与上线分离**：合并代码不等于生产启用（D3）。仓库默认关闭；真实 Windows + CMX + Telegram 图片 canary 留证前，生产接线只能记 \`DISABLED\` / 未验证，不得写成 \`VERIFIED\`。

本条取代 D15；D15 保留为历史，除“vision context 永不回 Telegram”外，其余边界已在本条逐项重述。

---

`;
          decisions = replaceOnce(decisions, candidateAnchor, `${d30}${candidateAnchor}`, 'candidate anchor');
          const c6Start = decisions.indexOf('### C6 · 多 Bot、Route 1 / Route 2、Apple Watch、CMX');
          if (c6Start < 0) throw new Error('missing anchor: C6');
          const c6Replacement = `### C6 · 多 Bot、Route 1 / Route 2、Apple Watch

\`\`\`text
Status: OPEN
\`\`\`

- **已收窄**：Route 1 / Route 2 已由 D25 批准；CMX 的 Telegram 图片识别 / OCR 接入已由 **D30** 批准并移出本候选。本条剩余范围只有**多 Bot、Apple Watch**。
- **Known facts**：多 Bot / Apple Watch 当前仍为 \`DEFERRED\`，未排期。Apple Watch 只有 5 份规格文档，代码侧零实现。
- **Decision needed**：剩余两者是否以及何时排期。
- **Not authorised**：在排期前对剩余两者投入实现工作。
`;
          decisions = decisions.slice(0, c6Start) + c6Replacement;
          fs.writeFileSync(decisionsPath, decisions);

          const overviewPath = 'docs/architecture/SYSTEM_OVERVIEW.md';
          let overview = fs.readFileSync(overviewPath, 'utf8');
          overview = replaceOnce(
            overview,
            '        注：这条分支不走 resolveVisionContext() —— Telegram 媒体\n        以 <media> 引用进 envelope，是刻意设计（DECISIONS.md D15）',
            '        注：这条分支仍不走通用 resolveVisionContext()。Telegram 媒体\n        默认只以 <media> 引用进 envelope；显式开启 cmx-recognize 时，\n        MediaInboxService 在 photo 原子落盘后调用 CMX /files/recognize，\n        将有界、untrusted 的识别结果附到当前用户正文（DECISIONS.md D30）',
            'overview Telegram path',
          );
          const budgetAnchor = '**这个分档就是"积木"的接缝。**';
          const visionBoundary = '**Telegram CMX 图片上下文**属于“当前回合临时附件数据”，不进入三档长期记忆：默认关闭；开启时只随该条 photo 回合出现，明确标为 untrusted，且在 conversation purity 阶段剥除。它不是常驻注入、不是 memory 目录，也不是完全按需翻档。\n\n';
          overview = replaceOnce(overview, budgetAnchor, `${visionBoundary}${budgetAnchor}`, 'overview budget anchor');
          fs.writeFileSync(overviewPath, overview);
          NODE

      - name: Commit authority-document sync and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name "cyberboss-pr133-doc-sync"
          git config user.email "cyberboss-pr133-doc-sync@local.invalid"
          git rm .github/workflows/pr133-doc-sync.yml
          git add docs/CURRENT_STATUS.md docs/DECISIONS.md docs/architecture/SYSTEM_OVERVIEW.md
          git diff --cached --check
          git commit -m "docs(vision): register Telegram CMX recognition boundary"
          git push origin HEAD:feat/tg-cmx-image-recognition-20260803
